<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f4ed">
  <title>创建账号 | 企业培训平台</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-auth-page="register">
  <main class="auth-shell" data-od-id="register-main">
    <aside class="story" data-od-id="register-story" aria-hidden="true">
      <div class="brand" data-od-id="register-brand">
        <span class="logo-slot" aria-label="品牌 Logo 占位">LOGO</span>
        <div>
          <strong>企业培训平台</strong>
          <span>员工学习中心</span>
        </div>
      </div>
      <div class="story-body">
        <p class="eyebrow">新员工入职</p>
        <h1 data-od-id="register-story-title">用邀请码加入学习空间</h1>
        <p class="lead">填写姓名与联系方式，完成账号开通后即可开始课程。</p>
      </div>
      <div class="story-card" data-od-id="register-module">
        <p class="eyebrow">开通后可使用</p>
        <h2>从第一门课开始</h2>
        <ul class="story-list">
          <li><strong>个人档案</strong> 绑定企业身份</li>
          <li><strong>课程入口</strong> 进入分配任务</li>
          <li><strong>进度同步</strong> 多端继续学习</li>
        </ul>
      </div>
    </aside>

    <section class="form-panel" data-od-id="register-form-panel">
      <div class="mobile-brand" data-od-id="register-mobile-brand">
        <span class="logo-slot" aria-label="品牌 Logo 占位">LOGO</span>
        <div>
          <strong>企业培训平台</strong>
          <span>员工学习中心</span>
        </div>
      </div>

      <header class="panel-top" data-od-id="register-panel-top">
        <span>创建员工账号</span>
        <a href="login.html" data-od-id="register-to-login">返回登录</a>
      </header>

      <form class="auth-form" id="register-form" novalidate data-od-id="register-form">
        <div class="form-heading">
          <h1 data-od-id="register-title">注册账号</h1>
          <p>填写姓名、手机号、密码与邀请码。</p>
        </div>

        <div class="field" data-field="name">
          <label for="name">姓名</label>
          <input id="name" name="name" type="text" autocomplete="name" maxlength="20" placeholder="请输入真实姓名" aria-describedby="name-error" data-od-id="register-name">
          <p class="field-error" id="name-error" aria-live="polite"></p>
        </div>

        <div class="field" data-field="phone">
          <label for="phone">手机号</label>
          <input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="11" placeholder="请输入 11 位手机号" aria-describedby="phone-error" data-od-id="register-phone">
          <p class="field-error" id="phone-error" aria-live="polite"></p>
        </div>

        <div class="field has-action" data-field="password">
          <label for="password">密码</label>
          <div class="input-wrap">
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" placeholder="至少 6 位密码" aria-describedby="password-error" data-od-id="register-password">
            <button class="input-action" type="button" data-password-toggle aria-controls="password" aria-label="显示密码" data-od-id="register-toggle">显示</button>
          </div>
          <p class="field-error" id="password-error" aria-live="polite"></p>
        </div>

        <div class="field" data-field="inviteCode">
          <label for="inviteCode">邀请码</label>
          <input id="inviteCode" name="inviteCode" type="text" autocomplete="off" maxlength="16" placeholder="请输入企业邀请码" aria-describedby="inviteCode-error" data-od-id="register-invite">
          <p class="field-error" id="inviteCode-error" aria-live="polite"></p>
        </div>

        <button class="btn-primary" type="submit" data-submit-button data-od-id="register-submit">创建账号</button>
        <p class="form-status" role="status" aria-live="polite" data-form-status data-od-id="register-status"></p>
        <p class="switch">已有账号？ <a href="login.html" data-od-id="register-login-link">直接登录</a></p>
      </form>

      <footer class="panel-foot" data-od-id="register-footer">邀请码由企业管理员发放，仅限内部使用。</footer>
    </section>
  </main>
  <script src="auth.js" defer></script>
</body>
</html>
