services:
  yuanwo-train-migrate:
    image: "${MIGRATION_IMAGE:?MIGRATION_IMAGE is required}"
    container_name: "${MIGRATION_CONTAINER_NAME:-yuanwo-train-migrate}"
    env_file:
      - .env.production
    profiles:
      - tools

  yuanwo-train-app:
    image: "${APP_IMAGE:?APP_IMAGE is required}"
    container_name: "${APP_CONTAINER_NAME:-yuanwo-train-app}"
    env_file:
      - .env.production
    environment:
      RENDER_SERVICE_URL: http://yuanwo-train-render-service:9000
      NO_PROXY: localhost,127.0.0.1,yuanwo-train-render-service
      no_proxy: localhost,127.0.0.1,yuanwo-train-render-service
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - yuanwo-train-app-data:/app/data
    networks:
      - default
      - render
    healthcheck:
      test: 
       [ 
        "CMD-SHELL", 
        "wget -q -O - http://127.0.0.1:3000/api/health >/dev/null 2>&1",
       ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  yuanwo-train-render-service:
    image: "${RENDER_IMAGE:?RENDER_IMAGE is required}"
    container_name: "${RENDER_CONTAINER_NAME:-yuanwo-train-render-service}"
    expose:
      - "9000"
    cap_add:
      - NET_ADMIN
    environment:
      PORT: "9000"
      RENDER_MAX_CONCURRENCY: "1"
      RENDER_MAX_CONCURRENT_EXTRACTIONS: "1"
      RENDER_MAX_JOBS_PER_USER: "1"
      RENDER_MAX_QUEUE: "5"
      RENDER_JOB_TTL_MS: "1800000"
      RENDER_JOB_DEADLINE_MS: "2700000"
      RENDER_MAX_UPLOAD_BYTES: "314572800"
      RENDER_MAX_ENTRIES: "5000"
      RENDER_MAX_ENTRY_BYTES: "209715200"
      RENDER_MAX_EXPANDED_BYTES: "536870912"
      RENDER_MAX_COMPRESSION_RATIO: "200"
      RENDER_EGRESS_LOCKDOWN: "true"
      PRODUCER_TMP_PROJECT_DIR: /tmp/openmaic-renders
      HF_STATIC_DEDUP: "true"
      HF_STATIC_DEDUP_VERIFY: "true"
      # Ceiling for verified static reuse on typical 10–20 minute courses.
      HF_STATIC_DEDUP_VERIFY_MAX_MS: "300000"
      # Explicitly pin the producer job: skip auto-calibration, avoid the
      # observed two-worker CDP timeout, and enable single-worker streaming.
      RENDER_PRODUCER_WORKERS: "1"
      PRODUCER_MAX_WORKERS: "1"
      PRODUCER_STREAMING_ENCODE_MAX_DURATION_SECONDS: "1800"
    pids_limit: 512
    networks:
      - render
    volumes:
      - yuanwo-train-render-scratch:/tmp/openmaic-renders
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:9000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"
    restart: unless-stopped

networks:
  default: {}
  render:
    internal: true

volumes:
  yuanwo-train-app-data:
  yuanwo-train-render-scratch:

